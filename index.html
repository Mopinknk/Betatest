<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>บ้านพันตาเซอร์วิส | BANPHANTA SERVICE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#14532d;--g2:#166534;--gl:#ecf7ef;--n:#1e293b;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;color:var(--n);background:#fff;line-height:1.7}
img{max-width:100%;display:block}
a{color:inherit}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 1px 12px #0001}
.hd{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--g);text-decoration:none}
.brand img{width:40px;height:40px;object-fit:contain}
nav.m{display:flex;gap:4px}
nav.m a{padding:8px 12px;border-radius:99px;text-decoration:none;font-weight:500;font-size:15px}
nav.m a:hover{background:var(--gl);color:var(--g)}
#bg{display:none;background:none;border:0;font-size:26px;cursor:pointer;color:var(--g)}
section{padding:72px 0}
.rv{opacity:0;transform:translateY(18px);transition:.6s}
.rv.in{opacity:1;transform:none}
h2.t{font-size:clamp(26px,4vw,38px);color:var(--g);font-weight:800;text-align:center}
.sub{text-align:center;color:#64748b;margin-bottom:36px}
.hero{background:linear-gradient(135deg,var(--gl),#fff);padding:56px 0}
.hg{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.hero .lg{width:96px;height:96px;object-fit:contain;margin-bottom:12px}
.hero h1{font-size:clamp(30px,5vw,52px);color:var(--g);line-height:1.2;font-weight:800}
.hero h3{font-size:clamp(20px,3vw,28px);margin:6px 0 14px}
.hero p{font-size:18px;color:#475569}
.bd{display:inline-block;margin:18px 0;background:var(--g);color:#fff;padding:10px 20px;border-radius:99px;font-weight:700}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.b,.b2{border:0;cursor:pointer;font:inherit;font-weight:700;padding:10px 20px;border-radius:99px;text-decoration:none;display:inline-block}
.b{background:var(--g);color:#fff}.b:hover{background:var(--g2)}
.b2{background:#fff;color:var(--g);border:2px solid var(--g)}
.cv{border-radius:var(--r);aspect-ratio:4/3;object-fit:cover;width:100%;box-shadow:0 20px 40px #14532d33}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
.ab .im{display:grid;gap:14px}
.ab .im img{border-radius:var(--r);width:100%;aspect-ratio:16/10;object-fit:cover}
.ab p{font-size:18px;white-space:pre-line}
.sv{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.card{background:#fff;border-radius:var(--r);box-shadow:0 6px 24px #0001;overflow:hidden;border:1px solid #e2e8f0}
.card img.ci{width:100%;aspect-ratio:16/9;object-fit:cover}
.card .cb{padding:20px}
.card h3{color:var(--g);font-size:21px;margin-bottom:8px}
.card ul{list-style:none}
.card li{padding:6px 0 6px 28px;position:relative;border-bottom:1px dashed #e2e8f0}
.card li:before{content:"✓";position:absolute;left:0;color:var(--g2);font-weight:800}
.alt{background:var(--gl)}
.wy{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:24px}
.wy .card{padding:20px}
.wy .ic{width:40px;height:40px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:10px}
.qt{margin-top:28px;background:var(--g);color:#fff;border-radius:var(--r);padding:28px;text-align:center;font-size:20px;font-weight:500}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.gl figure{cursor:pointer;border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:4/3;background:#e2e8f0}
.gl img{width:100%;height:100%;object-fit:cover;transition:.4s}
.gl figure:hover img{transform:scale(1.06)}
.gl figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;color:#fff;font-size:14px;background:linear-gradient(transparent,#000b)}
.pt{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.pt .card{padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:140px;gap:8px}
.pt img{max-height:70px;object-fit:contain}
.pt .ini{width:60px;height:60px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;font-size:26px;font-weight:800}
.pt span{font-size:14px;font-weight:500}
.ct{display:grid;grid-template-columns:1fr 1.2fr;gap:28px}
.ct .card{padding:20px;margin-bottom:14px}
.ct h4{color:var(--g);margin-bottom:6px}
.ct a.tel{display:block;padding:4px 0;text-decoration:none;font-weight:500}
.ct a.tel:hover{color:var(--g2);text-decoration:underline}
iframe{width:100%;height:100%;min-height:380px;border:0;border-radius:var(--r)}
footer{background:var(--g);color:#fff;padding:32px 0;text-align:center;font-size:15px}
footer a{color:#bbf7d0}
#lb{position:fixed;inset:0;background:#000d;z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
#lb img{max-height:80vh;border-radius:12px}
#lb p{color:#fff;margin-top:10px}
#md{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;background:#000a;padding:16px}
#md>div{background:#fff;border-radius:var(--r);padding:24px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
#md h3{color:var(--g);margin-bottom:12px}
#adm{position:fixed;inset:0;z-index:300;background:#f1f5f9;display:none;overflow:auto}
.atop{background:var(--g);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
.atop button{margin-left:8px;padding:6px 14px;border-radius:99px;border:0;cursor:pointer;font:inherit}
.abody{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:20px;max-width:1100px;margin:0 auto}
.abody nav{display:flex;flex-direction:column;gap:6px}
.abody nav button{text-align:left;padding:10px 14px;border:0;border-radius:10px;background:#fff;cursor:pointer;font:inherit}
.abody nav button.on{background:var(--g);color:#fff}
.abody main{background:#fff;border-radius:var(--r);padding:22px;min-width:0}
.abody h3{color:var(--g);margin-bottom:14px}
.f{margin-bottom:14px}
.f label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.f input:not([type=file]):not([type=checkbox]),.f textarea{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}
.f small{display:block;color:#64748b}
.pv{max-height:120px;border-radius:10px;margin:6px 0;border:1px solid #e2e8f0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px}
.li img,.li .nt{width:56px;height:42px;object-fit:cover;border-radius:8px;background:var(--gl);flex:none}
.li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li button{padding:5px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;cursor:pointer}
.li button.d{color:#b91c1c}
#ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 22px;border-radius:99px;z-index:500;display:none}
@media(max-width:820px){
#bg{display:block}
nav.m{display:none;position:absolute;top:64px;left:0;right:0;background:#fff;flex-direction:column;padding:10px;box-shadow:0 10px 20px #0002}
nav.m.o{display:flex}
.hg,.ab,.ct{grid-template-columns:1fr}
.abody{grid-template-columns:1fr}
.abody nav{flex-direction:row;overflow-x:auto}
.abody nav button{white-space:nowrap}
section{padding:48px 0}
.pt{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pt .card{padding:10px 6px;min-height:84px;gap:4px;border-radius:12px;box-shadow:0 2px 8px #0001}
.pt img{max-height:36px}
.pt .ini{width:34px;height:34px;font-size:16px}
.pt span{font-size:11px;line-height:1.3}
}
</style>
</head>
<body>
<header><div class="w hd"><a class="brand" href="#home" id="hb"></a><button id="bg" onclick="document.getElementById('nv').classList.toggle('o')">☰</button><nav class="m" id="nv"></nav></div></header>
<main id="pub"></main>
<footer><div class="w" id="ft"></div></footer>
<div id="lb" onclick="this.style.display='none'"><img id="lbi" alt=""><p id="lbc"></p></div>
<div id="md"><div id="mdc"></div></div>
<div id="adm"></div>
<div id="ts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const KEY='banphanta_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v=id=>($(id)?$(id).value:'').trim();
const ph=(t,a,b)=>'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/><text x="400" y="320" font-size="44" text-anchor="middle" fill="#fff" font-family="sans-serif">'+t+'</text></svg>');
const LOGO='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 8 92 44H80v44H20V44H8z" fill="#14532d"/><rect x="40" y="58" width="20" height="30" fill="#bbf7d0"/><text x="50" y="52" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff" font-family="sans-serif">BS</text></svg>');
const SB_URL='https://buvmxplxpzpbkedkihjc.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dm14cGx4cHpwYmtlZGtpaGpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzODE5NDcsImV4cCI6MjEwOTk1Nzk0N30.oIEtPcUfU0dpxdQintLJDPC8BRln5LshnByRfpEBMLQ';
const db=supabase.createClient(SB_URL,SB_KEY);
const NOPERM='บัญชีนี้ไม่มีสิทธิ์แก้ไขข้อมูล (ตรวจสอบว่าเพิ่มในตาราง admins แล้ว และรัน SQL ครบ)';
const SMAP={nameTh:'name_th',nameEn:'name_en',tagline:'tagline',promo:'promo',logo:'logo_url',cover:'cover_url',aboutTitle:'about_title',aboutText:'about_text',aboutImg:'about_img_url',aboutImg2:'about_img2_url',whyTitle:'why_title',whyIntro:'why_intro',whyItems:'why_items',whyQuote:'why_quote',fb:'fb',fbUrl:'fb_url',phones:'phones',address:'address',hours:'hours',lic1:'lic1',lic2:'lic2',mapQ:'map_q',vis:'vis'};
const DV={about:true,services:true,why:true,gallery:true,partners:true,contact:true};
const TB={services:'services',gallery:'gallery_images',partners:'partners'};
let D={s:{},services:[],gallery:[],partners:[]};
for(const k in SMAP)D.s[k]='';
D.s.vis=Object.assign({},DV);
async function load(){
 const r=await Promise.all([
  db.from('site_settings').select('*').eq('id',1).maybeSingle(),
  db.from('services').select('*').order('sort_order').order('id'),
  db.from('gallery_images').select('*').order('sort_order').order('id'),
  db.from('partners').select('*').order('sort_order').order('id')]);
 const er=r.find(x=>x.error);
 if(er){console.error(er.error);return false}
 if(r[0].data)for(const k in SMAP)if(r[0].data[SMAP[k]]!=null)D.s[k]=r[0].data[SMAP[k]];
 D.s.vis=Object.assign({},DV,D.s.vis);
 D.services=r[1].data.map(x=>({id:x.id,so:x.sort_order,title:x.title,desc:x.description,img:x.img_url,items:x.items||[]}));
 D.gallery=r[2].data.map(x=>({id:x.id,so:x.sort_order,cap:x.caption,img:x.img_url}));
 D.partners=r[3].data.map(x=>({id:x.id,so:x.sort_order,name:x.name,logo:x.logo_url}));
 return true;
}
async function up(d,folder){
 if(!d||d.slice(0,5)!=='data:')return d||'';
 const png=d.indexOf('data:image/png')===0;
 const path=folder+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+(png?'.png':'.jpg');
 const blob=await (await fetch(d)).blob();
 const r=await db.storage.from('site-images').upload(path,blob,{contentType:png?'image/png':'image/jpeg',cacheControl:'31536000'});
 if(r.error)throw r.error;
 return db.storage.from('site-images').getPublicUrl(path).data.publicUrl;
}
function fail(e){console.error(e);alert('บันทึกไม่สำเร็จ: '+((e&&e.message)||e))}
function toast(t){const e=$('ts');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}

/* ---------- PUBLIC SITE ---------- */
function render(){
 const s=D.s,vs=s.vis;
 $('hb').innerHTML='<img src="'+esc(s.logo||LOGO)+'" alt=""><span>'+esc(s.nameEn)+'</span>';
 const L=[['home','หน้าแรก',1],['about','เกี่ยวกับเรา',vs.about],['services','บริการ',vs.services],['why','จุดเด่น',vs.why],['gallery','ผลงาน',vs.gallery],['partners','บริษัทในเครือ',vs.partners],['contact','ติดต่อเรา',vs.contact]];
 $('nv').innerHTML=L.filter(x=>x[2]).map(x=>'<a href="#'+x[0]+'" onclick="document.getElementById(\'nv\').classList.remove(\'o\')">'+x[1]+'</a>').join('');
 const ph2=s.phones.split('\n').map(x=>x.split('|')).filter(x=>x[0].trim());
 let h='<section class="hero" id="home"><div class="w hg"><div><img class="lg" src="'+esc(s.logo||LOGO)+'" alt="logo"><h1>'+esc(s.nameEn)+'</h1><h3>'+esc(s.nameTh)+'</h3><p>'+esc(s.tagline)+'</p><div class="bd">'+esc(s.promo)+'</div><div class="btns"><a class="b" href="#services">บริการของเรา</a><a class="b2" href="#contact">ติดต่อเรา</a></div></div><img class="cv" src="'+esc(s.cover||ph('ภาพหน้าสำนักงาน','#166534','#4ade80'))+'" alt="สำนักงาน"></div></section>';
 if(vs.about)h+='<section id="about" class="rv"><div class="w ab"><div><h2 class="t" style="text-align:left">'+esc(s.aboutTitle)+'</h2><br><p>'+esc(s.aboutText)+'</p></div><div class="im">'+(s.aboutImg?'<img src="'+esc(s.aboutImg)+'" alt="">':'')+(s.aboutImg2?'<img src="'+esc(s.aboutImg2)+'" alt="">':'')+'</div></div></section>';
 if(vs.services)h+='<section id="services" class="alt rv"><div class="w"><h2 class="t">บริการของเรา</h2><p class="sub">Our Services</p><div class="sv">'+D.services.map(x=>'<div class="card">'+(x.img?'<img class="ci" src="'+esc(x.img)+'" alt="">':'')+'<div class="cb"><h3>'+esc(x.title)+'</h3>'+(x.desc?'<p style="margin-bottom:8px">'+esc(x.desc)+'</p>':'')+'<ul>'+x.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul></div></div>').join('')+'</div></div></section>';
 if(vs.why)h+='<section id="why" class="rv"><div class="w"><h2 class="t">'+esc(s.whyTitle)+'</h2><p class="sub">Why Choose Us</p><p style="font-size:18px;text-align:center;max-width:820px;margin:auto">'+esc(s.whyIntro)+'</p><div class="wy">'+s.whyItems.split('\n').filter(x=>x.trim()).map((x,i)=>'<div class="card"><div class="ic">'+(i+1)+'</div>'+esc(x)+'</div>').join('')+'</div><div class="qt">“'+esc(s.whyQuote)+'”</div></div></section>';
 if(vs.gallery)h+='<section id="gallery" class="alt rv"><div class="w"><h2 class="t">ผลงานและภาพกิจกรรม</h2><p class="sub">Gallery</p><div class="gl">'+D.gallery.map((x,i)=>'<figure onclick="openLb('+i+')"><img loading="lazy" src="'+esc(x.img)+'" alt="'+esc(x.cap)+'">'+(x.cap?'<figcaption>'+esc(x.cap)+'</figcaption>':'')+'</figure>').join('')+'</div></div></section>';
 if(vs.partners)h+='<section id="partners" class="rv"><div class="w"><h2 class="t">บริษัทในเครือ</h2><p class="sub">Our Partners</p><div class="pt">'+D.partners.map(x=>'<div class="card">'+(x.logo?'<img src="'+esc(x.logo)+'" alt="">':'<div class="ini">'+esc(x.name.charAt(0))+'</div>')+'<span>'+esc(x.name)+'</span></div>').join('')+'</div></div></section>';
 if(vs.contact)h+='<section id="contact" class="alt rv"><div class="w"><h2 class="t">ติดต่อเรา</h2><p class="sub">Contact Us</p><div class="ct"><div><div class="card"><h4>📞 โทรศัพท์</h4>'+ph2.map(p=>'<a class="tel" href="tel:'+esc(p[0].replace(/[^0-9+]/g,''))+'">'+esc(p[0])+(p[1]?' ('+esc(p[1])+')':'')+'</a>').join('')+'</div><div class="card"><h4>Facebook</h4><a href="'+esc(s.fbUrl)+'" target="_blank" rel="noopener">'+esc(s.fb)+'</a></div><div class="card"><h4>📍 ที่อยู่</h4>'+esc(s.address)+'</div><div class="card"><h4>🕗 เวลาทำการ</h4>'+esc(s.hours)+'</div><div class="card"><h4>ข้อมูลใบอนุญาต</h4>ใบอนุญาตตัวแทนประกันชีวิต: '+esc(s.lic1)+'<br>ใบอนุญาตนายหน้าประกันวินาศภัย: '+esc(s.lic2)+'</div></div><div><iframe loading="lazy" src="https://maps.google.com/maps?q='+encodeURIComponent(s.mapQ)+'&output=embed" title="แผนที่"></iframe></div></div></div></section>';
 $('pub').innerHTML=h;
 $('ft').innerHTML='<b>'+esc(s.nameTh)+' ('+esc(s.nameEn)+')</b><br>'+esc(s.address)+'<br>'+(vs.contact?ph2.map(p=>'<a href="tel:'+esc(p[0].replace(/[^0-9+]/g,''))+'">'+esc(p[0])+'</a>').join(' · ')+'<br>':'')+'<small>© '+new Date().getFullYear()+' '+esc(s.nameEn)+' · <a href="#admin" onclick="adminEntry();return false">ผู้ดูแลระบบ</a></small>';
 document.querySelectorAll('.rv').forEach(e=>{if('IntersectionObserver' in window)io.observe(e);else e.classList.add('in')});
}
const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08}):null;
function openLb(i){const x=D.gallery[i];$('lbi').src=x.img;$('lbc').textContent=x.cap||'';$('lb').style.display='flex'}

/* ---------- MODAL / LOGIN ---------- */
function modal(h){$('mdc').innerHTML=h;$('md').style.display='flex'}
function closeM(){$('md').style.display='none';$('mdc').innerHTML=''}
async function isAdmin(){
 const u=(await db.auth.getUser()).data.user;if(!u)return false;
 const r=await db.from('admins').select('user_id').eq('user_id',u.id).maybeSingle();
 return !!r.data;
}
async function adminEntry(){
 const r=await db.auth.getSession();
 if(r.data.session&&await isAdmin())showAdm();else openLogin();
}
function openLogin(){
 modal('<h3>เข้าสู่ระบบผู้ดูแล</h3>'+fld('อีเมล','l_u','')+'<div class="f"><label>รหัสผ่าน</label><input id="l_p" type="password"></div><div class="row"><button class="b" onclick="login()">เข้าสู่ระบบ</button><button class="b2" onclick="closeM()">ยกเลิก</button></div>');
 $('l_p').onkeydown=e=>{if(e.key==='Enter')login()};
}
async function login(){
 const r=await db.auth.signInWithPassword({email:v('l_u'),password:$('l_p').value});
 if(r.error){alert('อีเมลหรือรหัสผ่านไม่ถูกต้อง');return}
 if(!await isAdmin()){await db.auth.signOut();alert('บัญชีนี้ไม่มีสิทธิ์ผู้ดูแลระบบ');return}
 closeM();showAdm();
}
async function logout(){await db.auth.signOut();closeAdm()}
function showAdm(){$('adm').style.display='block';document.body.style.overflow='hidden';adm()}
function closeAdm(){$('adm').style.display='none';document.body.style.overflow='';render()}

/* ---------- ADMIN HELPERS ---------- */
let T={},tab='home';
const fld=(l,id,val,t)=>'<div class="f"><label>'+l+'</label>'+(t==='ta'?'<textarea id="'+id+'" rows="5">'+esc(val)+'</textarea>':'<input id="'+id+'" value="'+esc(val)+'">')+'</div>';
const imgf=(l,id,val,w)=>{T[id]=val||'';return '<div class="f"><label>'+l+'</label><img class="pv" id="pv_'+id+'" src="'+esc(val||'')+'" '+(val?'':'style="display:none"')+'><input type="file" accept="image/*" onchange="pick(this,\''+id+'\','+w+')"><small id="in_'+id+'">เลือกรูปจากเครื่อง ระบบจะบีบอัดให้อัตโนมัติ</small><button class="b2" type="button" style="padding:3px 12px;margin-top:4px" onclick="clr(\''+id+'\')">ลบรูป</button></div>'};
function clr(id){T[id]='';const p=$('pv_'+id);p.style.display='none';p.removeAttribute('src');$('in_'+id).textContent='ลบรูปแล้ว (กดบันทึกเพื่อยืนยัน)'}
function pick(inp,id,w){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{const im=new Image();
  im.onload=()=>{
   const k=Math.min(1,w/Math.max(im.width,im.height));
   const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
   const x=c.getContext('2d');const png=f.type==='image/png'&&w<=500;
   if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
   x.drawImage(im,0,0,c.width,c.height);
   const d=png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.72);
   T[id]=d;const p=$('pv_'+id);p.src=d;p.style.display='block';
   $('in_'+id).textContent='บีบอัดแล้ว: '+Math.round(f.size/1024)+' KB → '+Math.round(d.length*.75/1024)+' KB (กดบันทึกเพื่อใช้งาน)';
  };
  im.onerror=()=>alert('ไฟล์ภาพไม่ถูกต้อง');im.src=r.result};
 r.readAsDataURL(f);
}
const TABS=[['home','หน้าแรก'],['about','เกี่ยวกับเรา'],['services','บริการ'],['why','จุดเด่น'],['gallery','Gallery'],['partners','บริษัทในเครือ'],['contact','ข้อมูลติดต่อ'],['gen','ข้อมูลทั่วไป']];
const TXT={home:['nameTh','nameEn','tagline','promo'],about:['aboutTitle','aboutText'],why:['whyTitle','whyIntro','whyItems','whyQuote'],contact:['fb','fbUrl','phones','address','hours','lic1','lic2','mapQ']};
const IMG={home:[['logo',500],['cover',1400]],about:[['aboutImg',1200],['aboutImg2',1200]]};
const sb=t=>'<div class="row"><button class="b" onclick="saveS(\''+t+'\')">💾 บันทึก</button></div>';
function adm(t){
 if(t)tab=t;T={};const s=D.s;let c='';
 if(tab==='home')c='<h3>จัดการหน้าแรก</h3>'+fld('ชื่อบริษัท (ไทย)','s_nameTh',s.nameTh)+fld('ชื่อบริษัท (อังกฤษ)','s_nameEn',s.nameEn)+fld('ข้อความแนะนำบริษัท','s_tagline',s.tagline)+fld('ข้อความประชาสัมพันธ์','s_promo',s.promo)+imgf('โลโก้บริษัท','s_logo',s.logo,500)+imgf('รูปภาพหน้าปก','s_cover',s.cover,1400)+sb('home');
 else if(tab==='about')c='<h3>จัดการข้อมูลบริษัท</h3>'+fld('หัวข้อ','s_aboutTitle',s.aboutTitle)+fld('เนื้อหาเกี่ยวกับบริษัท','s_aboutText',s.aboutText,'ta')+imgf('รูปภาพประกอบ 1','s_aboutImg',s.aboutImg,1200)+imgf('รูปภาพประกอบ 2','s_aboutImg2',s.aboutImg2,1200)+sb('about');
 else if(tab==='why')c='<h3>จัดการจุดเด่น</h3>'+fld('หัวข้อ','s_whyTitle',s.whyTitle)+fld('ข้อความแนะนำ','s_whyIntro',s.whyIntro,'ta')+fld('รายการจุดเด่น (บรรทัดละ 1 ข้อ)','s_whyItems',s.whyItems,'ta')+fld('ข้อความเน้นย้ำ','s_whyQuote',s.whyQuote,'ta')+sb('why');
 else if(tab==='contact')c='<h3>จัดการข้อมูลติดต่อ</h3>'+fld('ชื่อ Facebook','s_fb',s.fb)+fld('ลิงก์ Facebook','s_fbUrl',s.fbUrl)+fld('เบอร์โทรศัพท์ (บรรทัดละ 1 เบอร์ รูปแบบ เบอร์|ชื่อ)','s_phones',s.phones,'ta')+fld('ที่อยู่บริษัท','s_address',s.address,'ta')+fld('เวลาทำการ','s_hours',s.hours)+fld('เลขที่ใบอนุญาตตัวแทนประกันชีวิต','s_lic1',s.lic1)+fld('เลขที่ใบอนุญาตนายหน้าประกันวินาศภัย','s_lic2',s.lic2)+fld('ตำแหน่งแผนที่ (ที่อยู่ หรือ พิกัด เช่น 12.7,101.6)','s_mapQ',s.mapQ)+sb('contact');
 else if(tab==='gen'){
  const nm={about:'เกี่ยวกับเรา',services:'บริการ',why:'จุดเด่น',gallery:'Gallery',partners:'บริษัทในเครือ',contact:'ติดต่อเรา'};
  c='<h3>ข้อมูลทั่วไป</h3><div class="f"><label>เปิด/ซ่อนเนื้อหาแต่ละส่วน</label>'+Object.keys(nm).map(k=>'<label style="font-weight:400;display:block"><input type="checkbox" id="vi_'+k+'" '+(s.vis[k]?'checked':'')+'> แสดงส่วน '+nm[k]+'</label>').join('')+'</div>'+'<div class="f"><label>รหัสผ่านใหม่ (เว้นว่างถ้าไม่เปลี่ยน อย่างน้อย 6 ตัวอักษร)</label><input id="a_p" type="password"></div><div class="row"><button class="b" onclick="saveGen()">💾 บันทึก</button>'+(localStorage.getItem('banphanta_v1')?'<button class="b2" onclick="importOld()">นำเข้าข้อมูลเดิมจากเครื่องนี้</button>':'')+'</div>';
 } else {
  const k=tab,lab={services:'หมวดบริการ',gallery:'รูปภาพ',partners:'บริษัทในเครือ'}[k];
  c='<h3>จัดการ'+lab+'</h3><div class="row" style="margin-bottom:12px"><button class="b" onclick="edit(\''+k+'\',-1)">＋ เพิ่ม</button></div>'+(D[k].length?D[k].map((o,i)=>{
   const th=k==='services'?o.img:k==='gallery'?o.img:o.logo,nm=k==='services'?o.title:k==='gallery'?(o.cap||'(ไม่มีคำอธิบาย)'):o.name;
   return '<div class="li">'+(th?'<img src="'+esc(th)+'" alt="">':'<div class="nt"></div>')+'<span>'+esc(nm)+'</span><button onclick="mv(\''+k+'\','+i+',-1)">↑</button><button onclick="mv(\''+k+'\','+i+',1)">↓</button><button onclick="edit(\''+k+'\','+i+')">แก้ไข</button><button class="d" onclick="del(\''+k+'\','+i+')">ลบ</button></div>'}).join(''):'<p>ยังไม่มีรายการ</p>');
 }
 $('adm').innerHTML='<div class="atop"><b>ระบบหลังบ้าน · '+esc(s.nameTh)+'</b><span><button onclick="closeAdm()">ดูหน้าเว็บ</button><button onclick="logout()">ออกจากระบบ</button></span></div><div class="abody"><nav>'+TABS.map(x=>'<button class="'+(x[0]===tab?'on':'')+'" onclick="adm(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</nav><main>'+c+'</main></div>';
}
async function saveSettings(o){
 const r=await db.from('site_settings').update(o).eq('id',1).select();
 if(r.error)throw r.error;
 if(!r.data.length)throw new Error(NOPERM);
 for(const k in SMAP)if(SMAP[k] in o)D.s[k]=o[SMAP[k]];
 D.s.vis=Object.assign({},DV,D.s.vis);
 render();
}
async function saveS(t){
 const o={};
 (TXT[t]||[]).forEach(k=>{o[SMAP[k]]=v('s_'+k)});
 if(t==='home'&&!o.name_th){alert('กรุณากรอกชื่อบริษัท');return}
 try{
  toast('กำลังบันทึก...');
  for(const a of (IMG[t]||[])){const d=T['s_'+a[0]];if(d!==undefined)o[SMAP[a[0]]]=await up(d,'site')}
  await saveSettings(o);toast('บันทึกแล้ว');
 }catch(e){fail(e)}
}
async function saveGen(){
 try{
  toast('กำลังบันทึก...');
  const vis={};Object.keys(DV).forEach(k=>{vis[k]=$('vi_'+k).checked});
  await saveSettings({vis});
  const pw=$('a_p').value;
  if(pw){
   if(pw.length<6){alert('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');return}
   const r=await db.auth.updateUser({password:pw});if(r.error)throw r.error;
  }
  adm();toast('บันทึกแล้ว');
 }catch(e){fail(e)}
}
const CF={
 services:{blank:{title:'',desc:'',img:'',items:[]},t:'หมวดบริการ',
  f:o=>fld('ชื่อหมวดบริการ','e_title',o.title)+fld('คำอธิบาย (ไม่บังคับ)','e_desc',o.desc,'ta')+fld('รายการบริการ (บรรทัดละ 1 รายการ)','e_items',o.items.join('\n'),'ta')+imgf('รูปประกอบ','e_img',o.img,900),
  g:()=>({title:v('e_title'),desc:v('e_desc'),items:v('e_items').split('\n').map(x=>x.trim()).filter(Boolean),img:T.e_img||''}),ok:o=>o.title},
 gallery:{blank:{cap:'',img:''},t:'รูปภาพ',
  f:o=>imgf('รูปภาพ','e_img',o.img,1400)+fld('คำอธิบายภาพ','e_cap',o.cap),
  g:()=>({cap:v('e_cap'),img:T.e_img||''}),ok:o=>o.img},
 partners:{blank:{name:'',logo:''},t:'บริษัท',
  f:o=>fld('ชื่อบริษัท','e_name',o.name)+imgf('โลโก้','e_logo',o.logo,400),
  g:()=>({name:v('e_name'),logo:T.e_logo||''}),ok:o=>o.name}
};
function edit(k,i){
 T={};const c=CF[k],o=i<0?c.blank:D[k][i];
 modal('<h3>'+(i<0?'เพิ่ม':'แก้ไข')+c.t+'</h3>'+c.f(o)+'<div class="row"><button class="b" onclick="saveE(\''+k+'\','+i+')">💾 บันทึก</button><button class="b2" onclick="closeM()">ยกเลิก</button></div>');
}
const toRow=(k,o)=>k==='services'?{title:o.title,description:o.desc,img_url:o.img,items:o.items}:k==='gallery'?{caption:o.cap,img_url:o.img}:{name:o.name,logo_url:o.logo};
async function saveE(k,i){
 const c=CF[k],o=c.g();
 if(!c.ok(o)){alert(k==='gallery'?'กรุณาเลือกรูปภาพ':'กรุณากรอกชื่อ');return}
 try{
  toast('กำลังบันทึก...');
  const f=k==='partners'?'logo':'img';
  o[f]=await up(o[f],k);
  const row=toRow(k,o);
  if(i<0){
   row.sort_order=D[k].reduce((m,x)=>Math.max(m,x.so||0),0)+1;
   const r=await db.from(TB[k]).insert(row).select();if(r.error)throw r.error;
  }else{
   const r=await db.from(TB[k]).update(row).eq('id',D[k][i].id).select();
   if(r.error)throw r.error;if(!r.data.length)throw new Error(NOPERM);
  }
  await load();closeM();adm();render();toast('บันทึกแล้ว');
 }catch(e){fail(e)}
}
async function mv(k,i,d){
 const j=i+d,a=D[k];if(j<0||j>=a.length)return;
 [a[i],a[j]]=[a[j],a[i]];
 try{
  const rs=await Promise.all(a.map((x,n)=>x.so!==n+1?db.from(TB[k]).update({sort_order:n+1}).eq('id',x.id).select():null).filter(Boolean));
  for(const r of rs){if(r.error)throw r.error;if(!r.data.length)throw new Error(NOPERM)}
  await load();adm();render();
 }catch(e){fail(e);await load();adm()}
}
async function del(k,i){
 if(!confirm('ต้องการลบรายการนี้หรือไม่?'))return;
 try{
  const r=await db.from(TB[k]).delete().eq('id',D[k][i].id).select();
  if(r.error)throw r.error;if(!r.data.length)throw new Error(NOPERM);
  await load();adm();render();
 }catch(e){fail(e)}
}
async function importOld(){
 let o;try{o=JSON.parse(localStorage.getItem('banphanta_v1'))}catch(e){}
 if(!o||!o.s){alert('ไม่พบข้อมูลเดิมในเครื่องนี้');return}
 if(!confirm('นำเข้าข้อมูลเดิมจากเครื่องนี้ขึ้นระบบ?\nบริการ Gallery และบริษัทในเครือที่อยู่บนระบบตอนนี้จะถูกแทนที่ด้วยข้อมูลเดิม')) return;
 try{
  toast('กำลังนำเข้า อาจใช้เวลาสักครู่...');
  const img=async(d,f)=>(!d||d.indexOf('data:image/svg')===0)?'':await up(d,f);
  const row={};
  for(const k in SMAP){
   if(k==='vis'){row.vis=Object.assign({},DV,o.s.vis);continue}
   if(o.s[k]==null)continue;
   row[SMAP[k]]=['logo','cover','aboutImg','aboutImg2'].indexOf(k)>=0?await img(o.s[k],'site'):o.s[k];
  }
  const sv=[],gl=[],pt=[];
  for(const x of (o.services||[]))sv.push({title:x.title,description:x.desc||'',img_url:await img(x.img,'services'),items:x.items||[],sort_order:sv.length+1});
  for(const x of (o.gallery||[])){const u=await img(x.img,'gallery');if(u)gl.push({caption:x.cap||'',img_url:u,sort_order:gl.length+1})}
  for(const x of (o.partners||[]))pt.push({name:x.name,logo_url:await img(x.logo,'partners'),sort_order:pt.length+1});
  await saveSettings(row);
  const sets=[['services',sv],['gallery_images',gl],['partners',pt]];
  for(const t of sets){
   const d=await db.from(t[0]).delete().gt('id',0);if(d.error)throw d.error;
   if(t[1].length){const r=await db.from(t[0]).insert(t[1]).select();if(r.error)throw r.error}
  }
  await load();render();adm();toast('นำเข้าแล้ว');
 }catch(e){fail(e)}
}
$('pub').innerHTML='<p style="padding:100px 20px;text-align:center;color:#64748b">กำลังโหลดข้อมูล...</p>';
(async()=>{
 const ok=await load();
 if(!ok)$('pub').innerHTML='<p style="padding:100px 20px;text-align:center">โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรชหน้านี้ (ตรวจสอบว่ารัน SQL ใน Supabase แล้ว)</p>';
 else render();
 if(location.hash==='#admin')adminEntry();
})();
</script>
